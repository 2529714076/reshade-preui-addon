; ==============================================================================
;  PreUI.ini —— ReShade Pre-UI add-on 配置文件
;
;  放到 ReShade_PreUI.addon64 旁边（也就是游戏 exe 所在目录）。
;  整个文件都可以不存在——缺失时全部使用下面的默认值。
;  改完不需要重装，重启游戏生效。
; ==============================================================================

[PreUI]

; 0 = 只加载 DLL，不安装任何 hook（排查「游戏启动不了」时先用这个）。
; 1 = 正常启用。
Enabled=1

; 第 N 帧之后才开始扫描模块并挂钩 nvngx。
; 启动阶段挂钩容易和 loader lock / 反作弊扫描冲突，所以默认等到 120 帧。
; 如果游戏启动困难，把它调到 600 甚至 1200 再试。
DelayFrames=120

; 1 = 在 PreUI.log 里记录失败原因（最多 60 条，不会刷屏）。
; 0 = 只记录关键事件（挂上钩子、注入进度）。
Trace=1
